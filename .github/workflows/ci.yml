name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, build, smoke and Electron tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Build
        run: npm run build

      - name: Smoke tests
        run: xvfb-run --auto-servernum npm run test:smoke

      - name: Electron end-to-end tests
        run: xvfb-run --auto-servernum npm run test:e2e
