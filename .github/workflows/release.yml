name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            command: --linux
            artifacts: |
              release/*.deb
              release/*.AppImage
              release/latest-linux.yml
              release/*.blockmap
          - name: Windows
            os: windows-latest
            command: --win
            artifacts: |
              release/*.exe
              release/latest.yml
              release/*.blockmap
          - name: macOS
            os: macos-latest
            command: --mac --x64 --arm64
            artifacts: |
              release/*.dmg
              release/*.zip
              release/latest-mac.yml
              release/*.blockmap
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Optional accounts and metadata sync. The anon key is public by
          # design; row-level security protects each account.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build installers
        run: npx electron-builder ${{ matrix.command }} --publish never
        env:
          # Unsigned builds until signing certificates are added to the repo.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "Akshara ${TAG#v}" \
              --generate-notes
          fi
          gh release edit "$TAG" --latest
