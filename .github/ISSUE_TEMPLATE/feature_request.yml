name: Feature request
description: Suggest a reading, library, or sync improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Keep it concrete: what are you trying to do, and what gets in the way?

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do today, and why is it awkward?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: A sketch is enough. Mockups are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: PDF files must stay on the device that imported them.
          required: true
        - label: The reader should stay calm and distraction-free.
          required: true
